ingest:
  corpus: common_voice_ru_17_hf_mirror
  format: parquet
  inputs:
    train: ~/datasets/tts/common_voice_ru17/source/ru/train-*.parquet
    validation: ~/datasets/tts/common_voice_ru17/source/ru/validation-*.parquet
    test: ~/datasets/tts/common_voice_ru17/source/ru/test-*.parquet
  manifest: ~/datasets/tts/common_voice_ru17/manifest.jsonl
  audio_cache: ~/datasets/tts/common_voice_ru17/audio
  field_map:
    audio: audio
    text: sentence
    source_id: path
    speaker_id: client_id
    container_id: client_id
  extra_fields:
    - up_votes
    - down_votes
    - age
    - gender
    - accent
    - locale
    - segment
    - variant
    - continuation
  min_dur_s: 0.5
  max_dur_s: 15.0
  split:
    strategy: speaker
    train: 0.90
    val: 0.05
    test: 0.05

# Compatibility block for the existing ASR/DSP QC scripts (03 and 03b)
# plus Track N offline caches (C1/C2/C3) — paths mirror data_ruslan_local.yaml.
data:
  root: ~/datasets/tts
  ruslan_dir: ~/datasets/tts/common_voice_ru17
  manifest: ~/datasets/tts/common_voice_ru17/manifest.jsonl
  latent_dir: ~/datasets/tts/common_voice_ru17/latents
  text_hidden_dir: ~/datasets/tts/common_voice_ru17/text_hidden
  stats_path: ~/datasets/tts/common_voice_ru17/stats.safetensors
  align_dir: ~/datasets/tts/common_voice_ru17/align
  forced_path: ~/datasets/tts/common_voice_ru17/align/forced.json
  speaker: common_voice_ru_17_hf_mirror
  sample_rate_tgt: 24000
  shard_size: 2000
  min_dur_s: 0.5
  max_dur_s: 15.0
  asr_cer_reject: 0.25
  split:
    train: 0.90
    val: 0.05
    test: 0.05
    strategy: speaker_holdout
  # C1: encode only Track N inventory after R1 (not the full corpus):
  #   python scripts/04_encode_latents.py \
  #     --config configs/data_common_voice_ru17.yaml \
  #     --trackn-encode-union
  # Equivalent: --eval-set configs/eval_sets/trackn_{train,val,test,review}.json
