data:
  root: ~/datasets/tts
  ruslan_dir: ~/datasets/tts/ruslan
  manifest: ~/datasets/tts/ruslan/manifest.jsonl
  latent_dir: ~/datasets/tts/ruslan/latents
  text_hidden_dir: ~/datasets/tts/ruslan/text_hidden
  stats_path: ~/datasets/tts/ruslan/stats.safetensors
  align_dir: ~/datasets/tts/ruslan/align
  speaker: ruslan
  sample_rate_src: 22050
  sample_rate_tgt: 24000
  min_dur_s: 0.5
  max_dur_s: 10.0
  asr_cer_reject: 0.25
  split:
    train: 0.90
    val: 0.05
    test: 0.05
    strategy: contiguous_ranges
  shard_size: 2000
  challenge_set_size: 180
  stress_char: "\u0301"
  stress_augment_p: 0.15
  stress_agreement_threshold: 0.90
