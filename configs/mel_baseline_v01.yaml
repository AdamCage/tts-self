# Track A / A4 — non-AR mel baseline (no VibeVoice, no acoustic_dropout).
# S1 overfit path; scale only after intelligibility looks real.

model:
  mel:
    target: mel80
    vocab_size: 512          # overwritten at train time from PhoneVocab
    d_model: 256
    n_mels: 80
    enc_layers: 3
    dec_layers: 4
    n_heads: 4
    ffn_dim: 1024
    dropout: 0.1
    decoder: conv            # conv | transformer
    upsample: hard           # hard | soft (soft needs forced.json proj_W)
    predict_duration: true
    # CTC blank gaps: expand_neighbor (S1e+, no sil) | sil_fill (S1d ablation)
    gap_mode: expand_neighbor

loss:
  mel_l1: 1.0
  duration: 0.1

train:
  seed: 42
  stages:
    - name: S1
      max_utterances: 32
      steps: 3000
    - name: S2
      max_hours: 1.0
      steps: 12000
    - name: S3
      max_hours: 5.0
      steps: 20000
    - name: S4
      # full clean corpus (exclude_tags filtered); no max_hours cap
      steps: 40000
  data:
    # Mel shards are lazy via ShardReader; preload only for tiny S1 if desired.
    preload: false
    allow_missing_mel: false
    gap_mode: expand_neighbor  # absorb CTC blanks into neighbors (no sil token)

  batch:
    mode: fixed
    size: 8
  lr: 2.0e-4
  lr_schedule: cosine
  warmup_steps: 200
  min_lr_ratio: 0.05
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 50
  save_every: 500
  ema_decay: 0.999
  precision: bf16
  run_dir: runs/mel_baseline_v01
  # CER selection interface (hook up ASR eval later; ranking falls back to mel L1)
  cer_checkpoint:
    enabled: true
    every: 500

# Infer / vocoder (local weights only — no Hub download)
infer:
  vocoder_ckpt: null         # or ~/models/hifigan/generator.pt / $VOCODER_CKPT
  fallback: griffin_lim      # griffin_lim | save_mel
  # Note: mel baseline does NOT use acoustic_dropout.
  # Latent Talker configs may keep acoustic_dropout for S3 resume — do not strip abruptly.
