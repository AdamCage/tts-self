model:
  talker:
    d_model: 512
    num_layers: 4
    num_heads: 8
    ffn_dim: 2048
    cross_attention: true
    latent_dim: 64
    dropout: 0.1
    rope: true
    causal: true
  head_regression:
    hidden: 1024
    layers: 3
    residual: false
  stop_head:
    hidden: 256
    loss: focal        # bce | focal — focal keeps positives alive after TF collapse
    positive_weight: auto   # floor 15 when auto; used by BCE path
    stop_window: 5
    soft_labels: true       # linear ramp on last stop_window frames
    focal_gamma: 2.0
    focal_alpha: 0.85
  duration_head:
    level: utterance
    hidden: 256
  layer_mix:
    n_layers: 3
  text_projector:
    in_dim: 1024
    out_dim: 512
  latent_projector:
    in_dim: 64
    out_dim: 512

loss:
  l1: 1.0
  cosine: 0.2
  stop: 0.5
  duration: 0.25
  guided_attn_start: 1.0
  guided_attn_end_frac: 0.35

train:
  seed: 42
  stages:
    - name: S1
      max_utterances: 32
      steps: 3000
    - name: S2
      max_hours: 1.0
      steps: 12000
    - name: S2b
      max_hours: 1.0
      steps: 4000
    - name: S3
      max_hours: 5.0
      steps: 20000
    - name: S4
      # full corpus — only after head decision (Workstream D)
      steps: 40000
  data:
    # Preload caches only the stage subset (not full shard index).
    # Keep true through S3; set false only if host RAM is tight.
    preload: true
  batch:
    mode: auto
    candidates: [8, 16, 32, 64]
    target_vram_gb: 14.5
  lr: 2.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 200
  input_noise_sigma_max: 0.15
  # Kept for S3 resume compatibility. Mel baseline does not use this.
  # Prefer removing only after forced-align + explicit durations replace the need.
  acoustic_dropout: 0.40
  lr_schedule: cosine
  min_lr_ratio: 0.05
  # Optional: prefer synth CER when cer_eval_fn is wired (interface ready).
  cer_checkpoint:
    enabled: false
    every: 0
  log_every: 50
  eval_every: 250
  save_every: 1000
  # Free-running checkpoint selection: keep best.pt by duration_in_band/stop,
  # not by last TF step (avoids overwriting mid-run duration peaks).
  fr_checkpoint:
    enabled: true
    every: 1000
    n: 32
  ema_decay: 0.999
  precision: bf16
  run_dir: runs/v01_regression_direct
  # Infer stop defaults used during FR checkpoint eval
infer:
  stop:
    threshold: 0.45
    consecutive: 3
    min_frac: 0.94
    max_frac: 1.6
    duration_scale: 1.04
