infer:
  # Winning head after Phase 3 A/B: keep regression (see docs/phase3_ab.md)
  ckpt: runs/v01_regression_direct/best.pt
  codec: microsoft/VibeVoice-AcousticTokenizer
  qwen: Qwen/Qwen3.5-0.8B-Base
  stats: ~/datasets/tts/ruslan/stats.safetensors
  dtype: bfloat16
  cfg_scale: 1.3
  flow_steps: 4
  sampler: heun
  stream:
    enabled: true
    chunk_latents: 4
    min_pcm_ms: 40
  stop:
    threshold: 0.45
    consecutive: 3
    # Calibrated on val32 FR (S3 dur-ft ckpt): in_band 0.906, stop 1.0
    min_frac: 0.94
    max_frac: 1.6
    duration_scale: 1.04
  stress:
    use_accentuator: true
  out_dir: out
