# Track A / a5 — CFM (rectified-flow) mel decoder after Gate 3 PASS.
# Conditioned on duration-upsampled phone/char embeddings (same packing as mel baseline).
# No VibeVoice / Talker / acoustic_dropout. Griffin-lim OK for smoke demos.

mode: cfm

model:
  mel:
    target: mel80
    vocab_size: 512          # overwritten at train time from PhoneVocab
    d_model: 256
    n_mels: 80
    enc_layers: 3
    n_heads: 4
    ffn_dim: 1024
    dropout: 0.1
    upsample: hard           # hard | soft
    predict_duration: true
    gap_mode: expand_neighbor
    flow_hidden: 512
    flow_layers: 4
    time_embed_dim: 256
    cfg_dropout: 0.1
    time_sampling: logit_normal

loss:
  flow_mse: 1.0
  duration: 0.1

train:
  seed: 42
  stages:
    - name: S1
      max_utterances: 32
      steps: 2000
    - name: S2
      max_hours: 1.0
      steps: 12000
    - name: S3
      max_hours: 5.0
      steps: 20000
  data:
    preload: false
    allow_missing_mel: false
    gap_mode: expand_neighbor
  batch:
    mode: fixed
    size: 8
  lr: 2.0e-4
  lr_schedule: cosine
  warmup_steps: 200
  min_lr_ratio: 0.05
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 50
  save_every: 500
  ema_decay: 0.999
  precision: bf16
  run_dir: runs/mel_cfm_v01
  # Optional: warm-start encoder from regression mel best.pt
  # init_ckpt: runs/mel_baseline_v01_s3/best.pt
  cer_checkpoint:
    enabled: true
    every: 500

infer:
  flow_steps: 16
  flow_method: heun
  cfg_scale: 1.0
  vocoder_ckpt: null
  fallback: griffin_lim
