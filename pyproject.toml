[project]
name = "minispeech"
version = "0.1.0"
description = "MiniSpeech-RU: Russian TTS research prototype (VibeVoice latents + Qwen3.5 Talker)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MiniSpeech-RU" }]
dependencies = [
  "torch>=2.6.0",
  "torchaudio>=2.6.0",
  "transformers>=4.57.0",
  "accelerate>=1.0.0",
  "peft>=0.14.0",
  "safetensors>=0.4.0",
  "soundfile>=0.12.0",
  "librosa>=0.10.0",
  "numpy>=1.26.0",
  "einops>=0.8.0",
  "omegaconf>=2.3.0",
  "tqdm>=4.66.0",
  "jiwer>=3.0.0",
  "scipy>=1.11.0",
  "huggingface_hub>=0.26.0",
  "datasets>=3.0.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]
eval = [
  "openai-whisper>=20231117",
  "faster-whisper>=1.0.0",
]
stress = [
  "ruaccent>=1.5.0",
]
g2p = [
  "phonemizer>=3.2.0",
]
train = [
  "wandb>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minispeech"]

[tool.hatch.build.targets.editable]
# Ensure editable installs map the package name correctly
redirects = { "minispeech" = "src/minispeech" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
